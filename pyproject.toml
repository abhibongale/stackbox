[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stackbox"
version = "0.1.0"
description = "Run OpenStack Ironic upstream Zuul CI jobs locally in Docker containers"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "jinja2>=3.1",
    "ansible-runner>=2.4",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
stackbox = "stackbox.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stackbox.containers" = ["Containerfile.*"]

[tool.ruff]
target-version = "py310"
line-length = 100
